# Lab A1b (hosted runner) - GitHub builds and hosts the slides as a website
name: pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check + stamp
        run: |
          test -f site/index.html && ls site/slides | wc -l
          echo "{\"sha\":\"${GITHUB_SHA::7}\",\"run\":\"${GITHUB_RUN_NUMBER}\",\"deployed_on\":\"GitHub-hosted runner ${RUNNER_NAME}\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > site/build.json
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
