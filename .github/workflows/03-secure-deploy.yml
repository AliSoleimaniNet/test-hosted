# Lab A6 - secret + environment with REQUIRED REVIEWER (manual approval) + least-privilege token
# Setup once: gh secret set API_KEY ; Settings > Environments > production > Required reviewers
name: secure-deploy
on: [workflow_dispatch]
permissions:
  contents: read          # least privilege for GITHUB_TOKEN
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "build and test done - nothing secret here"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # job PAUSES here until a reviewer approves
    steps:
      - run: echo "approved! key length is ${#API_KEY}  value is masked:" "$API_KEY"
        env:
          API_KEY: ${{ secrets.API_KEY }}
