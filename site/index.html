<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CD in the Cloud - Slides</title>
<style>
:root{--bg:#07142b;--panel:#0d2247;--line:#25417a;--ink:#eaf1ff;--mut:#9db3da;--amber:#ffb400;--green:#19c37d}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Segoe UI,Roboto,Arial,sans-serif}
#app{display:grid;grid-template-columns:290px 1fr;grid-template-rows:56px 1fr 92px;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:2px solid var(--line)}
header b{font-size:18px}header .sub{color:var(--mut);font-size:13px}header .sp{flex:1}
.badge{font:12px Consolas,monospace;background:#0a1a38;border:1px solid var(--line);border-radius:20px;padding:4px 12px;color:var(--green);white-space:nowrap}
nav{overflow:auto;background:var(--panel);border-left:0;border-right:2px solid var(--line);padding:8px 0}
nav h4{margin:12px 14px 4px;color:var(--amber);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
nav a{display:block;padding:5px 14px;color:var(--ink);text-decoration:none;font-size:13.5px;border-left:4px solid transparent;cursor:pointer}
nav a:hover{background:#12306a}nav a.on{background:#17408a;border-left-color:var(--amber);font-weight:600}
nav a i{font-style:normal;color:var(--mut);display:inline-block;width:26px}
main{display:flex;align-items:center;justify-content:center;padding:14px;position:relative;min-height:0}
main img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 8px 40px #0009;background:#fff}
.btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:70px;border:0;border-radius:10px;background:#0d2247cc;color:#fff;font-size:28px;cursor:pointer}
.btn:hover{background:var(--amber);color:#000}#prev{left:20px}#next{right:20px}
footer{grid-column:1/3;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:var(--panel);border-top:2px solid var(--line)}
footer img{height:72px;border-radius:5px;border:3px solid transparent;cursor:pointer;opacity:.7}
footer img.on{border-color:var(--amber);opacity:1}
.cnt{color:var(--mut);font-size:13px}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{display:none}header{grid-column:1}main,footer{grid-column:1}.sub{display:none}}
</style>
</head>
<body>
<div id="app">
<header><b>CI/CD in the Cloud</b><span class="sub">Cloud Computing 1405 · University of Isfahan · Ali Soleimani &amp; Hossein Mostajeran</span><span class="sp"></span><span class="cnt" id="cnt"></span><span class="badge" id="badge">build info loading</span></header>
<nav id="nav"></nav>
<main><button class="btn" id="prev">&#10094;</button><img id="img" alt="slide"><button class="btn" id="next">&#10095;</button></main>
<footer id="thumbs"></footer>
</div>
<script>
var N=56,T=[],cur=1;
var SEC=[[1,"Intro"],[3,"What &amp; Why"],[7,"Architecture"],[9,"Practices"],[16,"Tools"],[19,"Runners"],[21,"GitHub &amp; GitLab"],[26,"Security"],[28,"Platform &amp; wrap-up"],[31,"Practical: setup"],[34,"Lab A: GitHub Actions"],[41,"Lab B: GitLab"],[48,"Lab C: Hamravesh"],[52,"Wrap-up"]];
function pad(n){return (n<10?"0":"")+n}
function go(n){n=Math.max(1,Math.min(N,n));cur=n;document.getElementById("img").src="slides/"+pad(n)+".jpg";
 document.getElementById("cnt").textContent=n+" / "+N;history.replaceState(null,"","#"+n);
 [].forEach.call(document.querySelectorAll("nav a"),function(a){a.classList.toggle("on",+a.dataset.n===n)});
 [].forEach.call(document.querySelectorAll("footer img"),function(a){var on=+a.dataset.n===n;a.classList.toggle("on",on);if(on)a.scrollIntoView({inline:"center",block:"nearest"})});
 var o=document.querySelector("nav a.on");if(o)o.scrollIntoView({block:"nearest"})}
function build(){var nav=document.getElementById("nav"),th=document.getElementById("thumbs"),h="",si=0;
 for(var i=1;i<=N;i++){if(si<SEC.length&&SEC[si][0]===i){h+="<h4>"+SEC[si][1]+"</h4>";si++}
  h+='<a data-n="'+i+'"><i>'+i+'</i>'+(T[i-1]||"Slide "+i)+'</a>';
  var im=new Image();im.src="slides/"+pad(i)+".jpg";im.dataset.n=i;im.loading="lazy";im.onclick=(function(k){return function(){go(k)}})(i);th.appendChild(im)}
 nav.innerHTML=h;[].forEach.call(nav.querySelectorAll("a"),function(a){a.onclick=function(){go(+a.dataset.n)}})}
document.getElementById("prev").onclick=function(){go(cur-1)};document.getElementById("next").onclick=function(){go(cur+1)};
document.onkeydown=function(e){if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown")go(cur+1);else if(e.key==="ArrowLeft"||e.key==="PageUp")go(cur-1);else if(e.key==="Home")go(1);else if(e.key==="End")go(N);else if(e.key==="f"){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}};
fetch("titles.json").then(function(r){return r.json()}).then(function(t){T=t}).catch(function(){}).then(function(){build();go(parseInt(location.hash.slice(1))||1)});
fetch("build.json").then(function(r){return r.json()}).then(function(b){document.getElementById("badge").textContent="build #"+b.run+" · "+b.sha+" · "+b.deployed_on}).catch(function(){document.getElementById("badge").textContent="local preview"});
</script>
</body></html>
